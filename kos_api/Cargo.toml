[package]
name = "kos_api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
data = { path = "../data" }
rand = "0.10.1"
reqwest = { version = "0.13.1", features = ["json", "query"] }
reqwest_cookie_store = "0.10.0"
securestore = "0.100.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
